<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Welcome to Django Class, {{userName}}</h1>
    <ul>
        {% for course in courses  %}
        <li>{{course}}</li>
        {% endfor %}

    </ul>

    <h2>Profile</h2>
    <p> {{profile.name}}</p>
    <p>{{profile.course}}</p>
    <p> {{profile.gender}} </p>


    {% if profile.active %}
        <p>Active</p>
    {% else %}
        <p>Inactive</p>
    {% endif %}
 
</body>
</html>
